<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOWNLOAD PROXY SERVER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #161b26;   /* soft navy page background */
    --card:      #1e2534;   /* slightly lighter card */
    --ring-gap:  #1e2534;   /* matches card so avatar gap blends in */
    --text:      #e6e9f0;   /* soft off-white, not pure white */
    --muted:     #9aa3b5;
    --accent:    #ff5c7a;   /* slightly softened pink-red */
    --violet:    #8b5cf6;
    --blue:      #3b73f0;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    font-family:'Poppins', sans-serif;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px 16px;
    background:var(--bg);
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--card);
    border-radius:28px;
    border:1px solid rgba(255,255,255,0.05);
    box-shadow:0 12px 40px rgba(0,0,0,0.35);
    padding:48px 28px 40px;
    text-align:center;
  }

  .avatar-wrap{
    width:180px;
    height:180px;
    margin:0 auto 30px;
    border-radius:50%;
    padding:6px;
    background:var(--ring-gap);
    box-shadow:
      0 0 0 4px var(--accent),
      0 0 24px 5px rgba(255,92,122,0.28);
  }

  .avatar-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    border-radius:50%;
  }

  h1{
    font-weight:800;
    font-size:1.9rem;
    letter-spacing:0.5px;
    color:var(--text);
    text-transform:uppercase;
    margin-bottom:26px;
  }

  .cta{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-decoration:none;
    font-weight:600;
    font-size:1.15rem;
    color:#ffffff;
    background:linear-gradient(90deg, var(--accent), var(--violet), var(--blue));
    padding:20px 20px;
    border-radius:50px;
    box-shadow:0 10px 26px rgba(139,92,246,0.28);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .cta:active{
    transform:translateY(3px);
    box-shadow:0 5px 14px rgba(139,92,246,0.28);
  }

  .cta:focus-visible{
    outline:3px solid rgba(139,92,246,0.6);
    outline-offset:3px;
  }

  .timer{
    margin-top:18px;
    font-weight:500;
    font-size:0.95rem;
    color:var(--muted);
  }

  .timer span{
    font-weight:700;
    color:#a78bfa;
  }

  @media (max-width:420px){
    .card{ padding:38px 20px 32px; border-radius:22px; }
    .avatar-wrap{ width:150px; height:150px; }
    h1{ font-size:1.5rem; }
    .cta{ font-size:1.05rem; padding:18px 16px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="avatar-wrap">
      <!-- replace src below with your Blogspot-hosted image URL -->
      <img src="pic1.jpg" alt="profile">
    </div>

    <h1>DOWNLOAD PROXY SERVER ↓</h1>

    <!-- replace href below with your destination link -->
    <a href="https://cvontrix.com/AZ86-AZTCUC-EYXTJ" class="cta" id="ctaBtn">
      Download Now
    </a>

    <div class="timer">Redirecting in <span id="countdown">2</span> seconds...</div>
  </div>

  <script>
    (function(){
      var seconds = 3;
      var countdownEl = document.getElementById('countdown');
      var redirectUrl = document.getElementById('ctaBtn').href;

      var interval = setInterval(function(){
        seconds -= 1;
        if(seconds <= 0){
          clearInterval(interval);
          countdownEl.textContent = 0;
          window.location.href = redirectUrl;
        } else {
          countdownEl.textContent = seconds;
        }
      }, 1000);
    })();
  </script>

</body>
</html>
